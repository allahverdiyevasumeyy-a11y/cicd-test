name: Ilk Docker CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları götür
        uses: actions/checkout@v4

      - name: Docker Image Yığ
        run: docker build -t menim-veb-saytim:v1 .

      - name: Uğurlu Nəticə Mesajı
        run: echo "Təbriklər! Docker Image uğurla yığıldı və test olundu! 🎉"
